apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-storage
  template:
    metadata:
      labels:
        app: httpd-storage
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: httpd-data
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: httpd-data
          persistentVolumeClaim:
            claimName: httpd-local-pvc
